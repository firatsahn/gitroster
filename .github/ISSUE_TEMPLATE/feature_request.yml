name: Feature request
description: An idea that would make gitroster more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like gitroster to do? Keep in mind it is read-only and has no runtime dependencies.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
