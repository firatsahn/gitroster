<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitroster</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script>try { const t = localStorage.getItem('gr-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch {}</script>
<style>
:root{--bg:#fff;--fg:#111;--mute:#777;--line:#e6e6e6;--card:#fafafa;--warn:#b45309;--ok:#15803d;--bar:#111;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111;--fg:#eee;--mute:#8a8a8a;--line:#262626;--card:#181818;--warn:#f59e0b;--ok:#4ade80;--bar:#eee;--logo:invert(1);color-scheme:dark}}
:root[data-theme=dark]{--bg:#111;--fg:#eee;--mute:#8a8a8a;--line:#262626;--card:#181818;--warn:#f59e0b;--ok:#4ade80;--bar:#eee;--logo:invert(1);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:32px 16px 80px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.logo{filter:var(--logo,none);width:24px;height:24px;border-radius:6px}
h1{font-size:18px;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px}
.sp{flex:1}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer}
button:hover{border-color:var(--fg)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
input{width:180px}
nav{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:12px}
nav a{padding:6px 0;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
nav a.on{color:var(--fg);border-color:var(--fg)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chip{border-radius:12px;padding:1px 10px;font-size:12px;color:var(--mute)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{border-top:1px solid var(--line);padding:12px 0}
.row:last-child{border-bottom:1px solid var(--line)}
.top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;cursor:pointer}
.name{font-weight:600}
.pin{border:0;padding:0 2px;color:var(--mute);cursor:pointer;background:none}
.pin.on{color:var(--fg)}
.path,.mono{font-family:ui-monospace,monospace;font-size:12px;color:var(--mute)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--mute);white-space:nowrap}
.tag.port{color:var(--ok);border-color:var(--ok)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.meta{color:var(--mute);font-size:12px}
.detail{display:none;margin-top:10px;padding:12px;background:var(--card);border-radius:6px}
.row.open .detail{display:block}
.detail .line{margin:6px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.k{color:var(--mute);width:72px;flex:none}
code{font-family:ui-monospace,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;cursor:copy;word-break:break-all}
.go{padding:0 8px;font-size:12px}
textarea{width:100%;min-height:54px;resize:vertical;font-size:13px}
.ai{white-space:pre-wrap;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:6px}
.log{white-space:pre-wrap;font:11px/1.4 ui-monospace,monospace;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:160px;overflow:auto;margin-top:6px}
table{width:100%;border-collapse:collapse}
td{padding:8px 8px 8px 0;border-top:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:1px solid var(--line)}
td.r{text-align:right;white-space:nowrap}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:500;margin:28px 0 6px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:4px 0 8px}
.stats b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em}
.stats span{color:var(--mute);font-size:12px}
.empty{color:var(--mute);padding:12px 0}
.empty-hero{padding:8px 0}.empty-hero .lead{font-size:16px;margin:0 0 4px}
.chip.more{border-style:dashed}
a{color:inherit}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.hide{display:none}
#page,#settings{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;overflow-y:scroll}
html{overflow-y:scroll}
#page.on{display:block}
.pm{max-width:var(--pw,920px);margin:0 auto;padding:32px 16px 80px}
.ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
#ptags .tag{margin-left:4px}
#plink{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-left:6px;padding:0;border:1px solid var(--line);border-radius:50%;color:var(--fg);text-decoration:none;vertical-align:middle}
#plink:hover{border-color:var(--fg)}
#plink.hide{display:none}
#sback{margin-bottom:10px}
#sback.hide{display:none}
#ptabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:16px}
#ptabs a{padding:6px 0;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
#ptabs a.on{color:var(--fg);border-color:var(--fg)}
.x{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
a.ibw{display:inline-flex}
#popen{display:inline-flex;gap:6px}
.line .ib,.ib.sm{width:28px;height:28px}
.ib.xs{width:22px;height:22px;border-radius:6px}
.ib.xs svg{width:13px;height:13px}
.top .go,.top .ib{align-self:center}
.ai-btn{color:var(--mute)}
.ai-btn.on{color:var(--fg);border-color:var(--fg)}
.ai-btn.stale{color:var(--warn);border-color:var(--warn)}
.ai-btn.busy svg{animation:spin 1s linear infinite}
.about ul{margin:6px 0 10px;padding-left:18px;color:var(--mute);font-size:13px}
.about li{margin:3px 0}
.about a{color:var(--fg)}
.ai .line{margin:4px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:nowrap}
.ai .v{flex:1;min-width:0}
.aihead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.aihead svg{color:var(--fg)}
.aifoot{margin-top:6px}
.opt.dim{opacity:.55}
.hint{margin:-2px 0 6px 24px}
.ib{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--fg)}
.ib:disabled svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.primary:hover{opacity:.85}
#settings{background:rgba(0,0,0,.45);align-items:flex-start;justify-content:center;padding:10vh 16px}
#settings.on{display:flex}
#settings .card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:20px;width:100%;max-width:460px}
.opt{display:flex;gap:8px;align-items:center;padding:4px 0;color:var(--fg);font-size:14px}
.opt input{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segopt{margin:0;cursor:pointer}
.segopt input{position:absolute;opacity:0;width:0;height:0}
.segopt span{display:block;padding:5px 16px;font-size:13px;color:var(--mute);border-left:1px solid var(--line)}
.segopt:first-child span{border-left:0}
.segopt input:checked+span{background:var(--fg);color:var(--bg)}
.segopt input:focus-visible+span{outline:2px solid var(--fg);outline-offset:-2px}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:32px;align-items:start}
@media(max-width:760px){.ov{grid-template-columns:1fr}}
.ov aside h2:first-child{margin-top:0}
.lbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);gap:1px}.lbar i{display:block}
.lg{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:1px 0}
.lg .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.split{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px;align-items:start}
.split.hist{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media(max-width:820px){.split,.split.hist{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.panel .bar2{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);font-size:13px;min-height:38px}
.panel .bar2 .sp{flex:1}
.crumbs{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.ent{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;border-top:1px solid var(--line);font-size:13px}
.ent:first-child{border-top:0}
.ent:hover{background:var(--card)}
.ent.sel{background:var(--card);box-shadow:inset 2px 0 var(--fg)}
.ent .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{flex:none;color:var(--mute)}
.ent.dir .ic{color:var(--fg)}
.list{max-height:70vh;overflow:auto}
.gl{overflow:auto;max-height:75vh}
.cp{max-height:75vh;overflow:auto}
.code{font:12px/1.55 ui-monospace,monospace;background:var(--bg);overflow:auto;max-height:70vh}
.panel .code{border:0}
.cl,.diff div{white-space:pre}
.cl{display:flex}
.cl i{flex:none;width:52px;text-align:right;padding-right:12px;color:var(--mute);font-style:normal;user-select:none}
.cl.hit{background:rgba(245,158,11,.28)}
.diff .add{background:rgba(22,163,74,.16)}.diff .del{background:rgba(220,38,38,.14)}.diff .hunk{color:var(--mute)}
details{margin:8px 0}summary{cursor:pointer;font:12px ui-monospace,monospace}
details .code{border:1px solid var(--line);border-radius:6px;background:var(--card)}
pre.msg,pre.readme{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;margin:6px 0}
pre.readme{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;max-height:420px;overflow:auto}
.sr{padding:3px 0;overflow:hidden;text-overflow:ellipsis}
.snip{font:12px ui-monospace,monospace;color:var(--mute)}
mark{background:rgba(245,158,11,.35);color:inherit;border-radius:2px}
.big{width:100%;padding-right:34px}
.sbox{position:relative;flex:0 1 440px;width:100%;display:inline-flex;align-items:center}
.x.clear{position:absolute;right:5px;width:24px;height:24px;border-color:transparent;background:none;color:var(--mute)}
.x.clear:hover{color:var(--fg);border-color:var(--line)}
input[type=checkbox],input[type=radio]{width:auto}
label{display:inline-flex;gap:4px;align-items:center;color:var(--mute);font-size:12px}
.gr.sel{background:var(--card)}
.gr{cursor:pointer;min-width:0}
.gr .refs{flex:none;max-width:40%;overflow:hidden;display:flex}
.gr .s{flex:1;min-width:0}
.hist .gr .a{display:none}
.gr{display:flex;align-items:center;height:26px;white-space:nowrap}
.gr svg{flex:none}
.gr.focus{background:var(--card);outline:1px solid var(--fg)}
.gr .h{font:11px ui-monospace,monospace;color:var(--mute);margin:0 8px}
.gr .s{overflow:hidden;text-overflow:ellipsis}
.gr .a{color:var(--mute);font-size:12px;margin-left:10px}
.ref{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-right:4px;color:var(--mute)}
.ref.local{color:var(--fg);border-color:var(--fg)}.ref.tag{color:var(--warn);border-color:var(--warn)}.ref.head{background:var(--fg);color:var(--bg)}
a.br{cursor:pointer;text-decoration:underline dotted}
</style>
</head>
<body>
<main>
  <header>
    <img class="logo" src="/icon.svg" alt="">
    <h1>gitroster</h1>
    <span class="sub" id="sub">loading…</span>
    <span class="sp"></span>
    <input id="q" placeholder="filter  ( / )" autocomplete="off">
    <a href="/api/export.md" download="gitroster.md" class="ibw"><button class="ib" title="Export everything as Markdown" aria-label="Export as Markdown"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button></a>
    <button id="cfg" class="ib" title="Settings" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button id="re" class="ib" title="Rescan" aria-label="Rescan"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
  </header>

  <nav id="tabs">
    <a data-tab="repos" class="on">Repos</a>
    <a data-tab="search">Search</a>
    <a data-tab="ports">Ports</a>
  </nav>

  <section id="repos">
    <div class="bar" id="chips"></div>
    <div class="bar" id="chips2"></div>
    <div class="bar"><span class="meta">Sort</span>
      <select id="sort"><option value="recent">last commit</option><option value="size">size</option><option value="name">name</option></select>
    </div>
    <div id="repolist"></div>
  </section>
  <section id="search" class="hide">
    <div id="sback" class="hide"></div>
    <div class="bar"><span class="sbox"><input id="sq" class="big" placeholder="Search all your repos" autocomplete="off"><button id="sclear" class="x clear hide" aria-label="Clear search" title="Clear (Esc)"><svg width="12" height="12" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></span>
      <label><input type="checkbox" data-scope="code" checked>code</label><label><input type="checkbox" data-scope="files" checked>files</label><label><input type="checkbox" data-scope="commits" checked>commits</label><label><input type="checkbox" data-scope="packages" checked>packages</label><label><input type="checkbox" id="sre">regex</label></div>
    <div id="sres"></div>
  </section>
  <section id="ports" class="hide"></section>
</main>
<div id="page"><div class="pm">
  <header class="ph">
    <div><b id="ptitle"></b> <span id="ptags"></span> <a id="plink" class="hide" target="_blank" rel="noopener"></a><div class="path" id="ppath"></div></div>
    <span class="sp"></span>
    <span id="popen"></span>
    <button id="pclose" class="x" aria-label="Close" title="Close (Esc)"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </header>
  <nav id="ptabs"></nav><div id="pbody"></div></div></div>
<div id="settings"><div class="card">
  <div class="ph" style="margin-bottom:12px"><b>Settings</b><span class="sp"></span><button id="sclose" class="x" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
  <div id="sbody"></div></div></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const home = p => S.home && p.startsWith(S.home) ? '~' + p.slice(S.home.length) : p;
const size = b => b == null ? '?' : b >= 2**30 ? (b/2**30).toFixed(1)+' GB' : b >= 2**20 ? (b/2**20).toFixed(0)+' MB' : Math.max(1, Math.round(b/1024))+' KB';
const days = t => t ? (Date.now()/1000 - t) / 86400 : Infinity;
const ago = t => { const d = days(t); return d === Infinity ? 'no commits' : d < 1 ? 'today' : d < 60 ? Math.floor(d)+'d ago' : d < 700 ? Math.floor(d/30)+'mo ago' : Math.floor(d/365)+'y ago'; };
const DORMANT = 90;

let S = {repos: [], envs: [], ports: [], containers: [], meta: {}};
let ui = {tab: 'repos', chip: 'all', more: false, open: new Set(), busy: new Set(), logs: {}};
try { Object.assign(ui, JSON.parse(localStorage.getItem('gr-ui') || '{}'), {open: new Set(), busy: new Set(), logs: {}}); } catch {}
if (!['repos', 'search', 'ports'].includes(ui.tab)) ui.tab = 'repos';
const saveUi = () => { try { localStorage.setItem('gr-ui', JSON.stringify({tab: ui.tab, chip: ui.chip, more: ui.more, sort: $('#sort').value})); } catch {} };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200); }
async function api(path, body) {
  const r = await fetch(path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

const meta = r => S.meta[r.path] || {};
const running = r => r.ports.length > 0;
const dormant = r => !running(r) && days(r.last_commit) > DORMANT;
const zombie = r => running(r) && days(r.last_commit) > DORMANT && !meta(r).pinned;
const W = r => r.work || {stashes: [], branches: [], worktrees: []};
const nStash = r => W(r).stashes.length;
const nLocal = r => W(r).branches.filter(b => b.state === 'local-only').length;
const nTrees = r => W(r).worktrees.length;
const repoByPath = () => Object.fromEntries(S.repos.map(r => [r.path, r]));

/* ---------- data ---------- */
async function load() {
  try { S = await api('/api/state'); if (!S.repos) S = {repos: [], envs: [], ports: [], containers: [], meta: {}}; } catch (e) { toast(e.message); }
  render();
  await rescan();
}
async function rescan() {
  $('#re').disabled = true; $('#sub').textContent = 'scanning…';
  try { S = await api('/api/scan', {}); } catch (e) { toast(e.message); }
  $('#re').disabled = false; render();
}
async function pollPorts() {
  if (document.hidden || $('#re').disabled) return;
  const a = document.activeElement;
  if (a && (a.tagName === 'TEXTAREA')) return;
  try { const p = await api('/api/ports'); S.ports = p.ports; S.containers = p.containers;
    for (const r of S.repos) r.ports = [...new Set(S.ports.filter(x => x.repo === r.path).map(x => x.port))].sort((a, b) => a - b);
    render(); } catch {}
}

/* ---------- render ---------- */
function render() {
  const q = $('#q').value.toLowerCase();
  const total = S.repos.reduce((a, r) => a + (r.size || 0), 0);
  $('#sub').textContent = S.scanned ? `${S.repos.length} repos · ${S.ports.length} ports · ${size(total)}${S.demo ? ' · demo data' : ''}` : 'no scan yet';
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === ui.tab));
  for (const id of ['repos', 'search', 'ports']) $('#' + id).classList.toggle('hide', id !== ui.tab);
  $('#q').style.visibility = ui.tab === 'search' ? 'hidden' : '';
  if (ui.tab === 'repos') renderRepos(q);
  if (ui.tab === 'ports') renderPorts(q);
  if (ui.tab === 'search' && !$('#sres').innerHTML) runSearch();
}

const PRIMARY_CHIPS = ['all', 'running', 'uncommitted', 'unpushed'];
function chips() {
  const R = S.repos.filter(r => !meta(r).ignored);
  const n = {all: R.length, running: R.filter(running).length, uncommitted: R.filter(r => r.dirty).length,
    unpushed: R.filter(r => r.ahead).length, mine: R.filter(r => r.kind === 'mine').length, fork: R.filter(r => r.kind === 'fork').length,
    clone: R.filter(r => r.kind === 'clone').length, local: R.filter(r => r.kind === 'local').length, dormant: R.filter(dormant).length,

/* ---------- commit graph ---------- */
const LANE = ['#6b7280', '#2563eb', '#16a34a', '#d97706', '#9333ea', '#dc2626', '#0891b2', '#be185d'];
function layoutGraph(commits) {
  let lanes = [], rows = [], maxw = 1;
  for (const c of commits) {
    const cols = []; lanes.forEach((h, i) => { if (h === c.hash) cols.push(i); });
    let col = cols.length ? cols[0] : lanes.indexOf(null);
    if (col < 0) col = lanes.length;
    const before = lanes.slice();
    for (const i of cols) lanes[i] = null;
    lanes[col] = null;
    const edges = [];
    c.parents.forEach((p, k) => {
      let j = lanes.indexOf(p);
      if (j < 0) { j = k === 0 ? col : (lanes.indexOf(null) < 0 ? lanes.length : lanes.indexOf(null)); lanes[j] = p; }
      edges.push(j);
    });
    const pass = []; before.forEach((h, i) => { if (h && !cols.includes(i)) pass.push(i); });
    rows.push({c, col, cols, edges, pass});
    while (lanes.length && lanes[lanes.length - 1] === null) lanes.pop();
    maxw = Math.max(maxw, lanes.length, before.length, col + 1, ...edges.map(e => e + 1));
  }
  return {rows, maxw};
}

  const X = i => 10 + i * 14, H = 26, M = 13, color = i => LANE[i % LANE.length];
  let g = '';
  for (const i of pass) g += `<line x1="${X(i)}" y1="0" x2="${X(i)}" y2="${H}" stroke="${color(i)}" stroke-width="2"/>`;
  for (const i of cols) g += `<line x1="${X(i)}" y1="0" x2="${X(col)}" y2="${M}" stroke="${color(i)}" stroke-width="2"/>`;
  for (const j of edges) g += `<line x1="${X(col)}" y1="${M}" x2="${X(j)}" y2="${H}" stroke="${color(j)}" stroke-width="2"/>`;
  g += `<circle cx="${X(col)}" cy="${M}" r="4.5" fill="${c.parents.length > 1 ? 'var(--bg)' : color(col)}" stroke="${color(col)}" stroke-width="2"/>`;

        <li>Ports and processes come from your operating system and are matched to repos by working directory.</li>
        <li>Search, history, files and diffs run git on demand. Everything stays on this machine.</li>
        <li>AI summaries are optional and only run the agent CLI you chose.</li>
        <li>Notes, pins and these settings are saved in your user config folder.</li>
      </ul>
      <div class="meta">Made by <a href="https://github.com/firatsahn" target="_blank" rel="noopener">firatsahn</a> ·
        <a href="https://github.com/firatsahn/gitroster/graphs/contributors" target="_blank" rel="noopener">all contributors</a> ·
        <a href="https://github.com/firatsahn/gitroster" target="_blank" rel="noopener">source</a></div></div>`;
}
async function saveCfg(patch) { try { cfg.settings = (await api('/api/settings', patch)).settings; toast('Saved'); } catch (e) { toast(e.message); } }
async function openSettings() {
  const had = cfg.version;  // loaded in the background at startup, so this is normally instant
  if (had) renderCfg(); else $('#sbody').innerHTML = '<div class="meta">Looking for editors, terminals and agents…</div>';
  $('#settings').classList.add('on');
  if (!had) { await loadCfg(); renderCfg(); }
}
$('#cfg').addEventListener('click', openSettings);
$('#sclose').addEventListener('click', () => $('#settings').classList.remove('on'));
$('#settings').addEventListener('click', e => { if (e.target.id === 'settings') $('#settings').classList.remove('on'); });
$('#settings').addEventListener('change', e => {
  if (e.target.name === 'theme') { applyTheme(e.target.value); return saveCfg({theme: e.target.value}); }
  if (e.target.name === 'editor') saveCfg({editor: e.target.value, editor_custom: $('#ecustom').value});
  if (e.target.id === 'eterm') saveCfg({terminal: e.target.value});
  if (e.target.id === 'ecustom') saveCfg({editor: 'custom', editor_custom: e.target.value});
  if (e.target.name === 'agent') saveCfg({agent: e.target.value, agent_custom: $('#acustom').value});
  if (e.target.id === 'acustom') saveCfg({agent: 'custom', agent_custom: e.target.value});
});

/* ---------- events ---------- */
async function act(fn) { try { await fn(); } catch (e) { toast(e.message); } render(); }

document.addEventListener('click', e => {
  const t = e.target, row = t.closest('.row'), path = row && row.dataset.path;
  if (t.closest('[data-tab]')) { ui.tab = t.closest('[data-tab]').dataset.tab; ui.back = null; showBack(); saveUi(); return render(); }
  const pp = t.closest('[data-pp]');
  if (pp && !t.closest('#page [data-ptab]')) { const d = pp.dataset; return openPage(d.pp, d.pt || 'overview', {file: d.pf, line: +d.pl || null, commit: d.pc, focus: d.pfocus}); }
  if (t.dataset.sq !== undefined) return searchFor(t.dataset.sq, null, t.dataset.regex === '1');
  if (t.hasAttribute('data-back')) { const b = ui.back; ui.back = null; showBack(); ui.tab = b.under || 'repos'; saveUi(); render(); return openPage(b.path, b.tab); }
  if (t.hasAttribute('data-more')) { ui.more = !ui.more; saveUi(); return render(); }
  const ai = t.closest('[data-ai]');
  if (ai) { const p = path || pg.path, rr = repoOf(p); return ai.dataset.ai === 'icon' && aiOf(rr) && !aiBusy(rr) ? openPage(p, 'overview') : runAi(p); }
  if (t.dataset.open && !row) return act(async () => { const o = await api('/api/open', {path: pg.path, target: t.dataset.open}); toast('Opened in ' + o.with); });
  if (t.dataset.chip) { ui.chip = t.dataset.chip; saveUi(); return render(); }
  if (t.dataset.kill) return act(async () => {
    if (!confirm(`Stop process ${t.dataset.kill} on port ${t.dataset.port}?`)) return;
    await api('/api/kill', {pid: +t.dataset.kill}); toast('Stopped'); setTimeout(pollPorts, 600);
  });
  if (t.tagName === 'CODE') { navigator.clipboard?.writeText(t.textContent); return toast('Copied'); }
  if (!row) return;
  const r = S.repos.find(x => x.path === path);
  if (t.dataset.open) return act(async () => { const o = await api('/api/open', {path, target: t.dataset.open}); toast('Opened in ' + o.with); });
  if (t.hasAttribute('data-pin')) return act(async () => { S.meta[path] = await api('/api/meta', {path, pinned: !meta(r).pinned}); });
  if (t.hasAttribute('data-ignore')) return act(async () => { S.meta[path] = await api('/api/meta', {path, ignored: !meta(r).ignored}); });
  if (t.dataset.start) return act(async () => {
    if (!confirm(`Run in ${home(path)}:\n\n${t.dataset.start}`)) return;
    ui.busy.add(path); render();
    try { await api('/api/start', {path, cmd: t.dataset.start}); toast('Started'); } finally { ui.busy.delete(path); }
    for (const ms of [1500, 4000]) setTimeout(async () => { ui.logs[path] = (await api('/api/log?path=' + encodeURIComponent(path))).log; pollPorts(); render(); }, ms);
  });
  if (t.closest('[data-toggle]') && !t.closest('button')) {
    ui.open.has(path) ? ui.open.delete(path) : ui.open.add(path); render();
  }
});
document.addEventListener('focusout', e => {
  if (!e.target.hasAttribute('data-note')) return;
  const path = e.target.closest('.row').dataset.path;
  api('/api/meta', {path, note: e.target.value}).then(m => { S.meta[path] = m; }).catch(err => toast(err.message));
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && ui.tab === 'search' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); return $('#sq').focus(); }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && $('#settings').classList.contains('on')) return $('#settings').classList.remove('on');
  if (e.key === 'Escape' && $('#page').classList.contains('on')) return closePage();
  if (e.key === 'Escape') { $('#q').value = ''; $('#q').blur(); render(); }
});
$('#q').addEventListener('input', render);
function clearSearch() { clearTimeout(searchTimer); $('#sq').value = ''; $('#sclear').classList.add('hide'); searchSeq++; $('#sres').innerHTML = searchHome(); $('#sq').focus(); }
$('#sclear').addEventListener('click', clearSearch);
$('#sq').addEventListener('input', () => { $('#sclear').classList.toggle('hide', !$('#sq').value); clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 350); });
$('#sq').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchTimer); runSearch(); } if (e.key === 'Escape' && $('#sq').value) { e.stopPropagation(); clearSearch(); } });
document.querySelectorAll('[data-scope], #sre').forEach(x => x.addEventListener('change', runSearch));
$('#sort').addEventListener('change', () => { saveUi(); render(); });
$('#re').addEventListener('click', rescan);
try { const s = JSON.parse(localStorage.getItem('gr-ui') || '{}').sort; if (s) $('#sort').value = s; } catch {}
$('#popen').innerHTML = openBtns();
loadCfg();  // editors, terminals and theme: ready before Settings is opened
load();
setInterval(pollPorts, 5000);
</script>
</body>
